<!DOCTYPE html>
<html lang="en-IE">
    <head>
        <meta charset="utf-8">
        <title>Form page</title>
        <link rel="stylesheet" href="project.css">
    </head>
    <body id="page3">
        <h1 id="h1pg3">Info page</h1>
        <h2 id="h2pg3">Information required to adopt a pet</h2>
        <form action="Form-results.html" method="get">
            <div>
                <label for="name">Name</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div>
                <label for="age">Age</label>
                <input type="number" name="age" id="age" min="1" max="100" step="1">
            </div>
            <div>
                <label for="date">Birthdate</label>
                <input type="date" name="date" id="date">
            </div>
            <div>
                Is this your first time adopting a pet?
                <div>
                    <label for="yes">Yes</label>
                    <input type="checkbox" name="yes" id="yes">
                </div>
                <div>
                    <label for="no">No</label>
                    <input type="checkbox" name="no" id="no">
                </div>
            </div>
            <div>
                <label for="Choose-A-Pet">Choose-A-Pet</label>
                <select name="Choose-A-Pet" id="Choose-A-Pet">
                    <option value="dog">dog</option>
                    <option value="cat">cat</option>
                    <option value="parrot">parrot</option>
                    <option value="rabbit">rabbit</option>
                </select>
            </div>
                <label for="how would you provide a good home to a virtual pet?">how would you provide a good home to a virtual pet?</label>
                <textarea name="how would you provide a good home to a virtual pet?" id="how would you provide a good home to a virtual pet?"></textarea>
            </div>
            <div id="idpg3">
                Are you by any chance intersted in any online
                social communities, multiplayer challenges, create a storyline for a virtual
                pet, or creating a new virtual pet</div>
                <div>
                    <label for="onlinesocial communities">onlinesocial communities</label>
                    <input type="checkbox" name="online social communities" id="online social communities">
                </div>
                <div>
                    <label for=" multiplayer challenges"> multiplayer challenges</label>
                    <input type="checkbox" name=" multiplayer challenges" id=" multiplayer challenges">
                </div>
                <div>
                    <label for="create a storyline">create a storyline</label>
                    <input type="checkbox" name="create a storyline" id="create a storyline">
                </div>
                <div>
                    <label for="creating a new virtual pet">creating a new virtual pet</label>
                    <input type="checkbox" name="creating a new virtual pet" id="creating a new virtual pet">
                </div>
                <div>
                    <label for="If you wish to uplod a story or a picture pleasedo so here">If you wish to uplod a story or a picture please
                    do so here</label>
                    <input type="file" id="file" accept="image/png, image/jpeg">
                </div>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </body>
